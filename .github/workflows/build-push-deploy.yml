# The display name of your automated pipeline workflow
name: Task 2 - Build, Push, and Version Deploy

# Controls when the action will run
on:
  push:
    branches:
      - main # Triggers the pipeline every single time you push code to the main branch

jobs:
  # =========================================================
  # JOB 1: Compile code, build Docker images, and push to cloud
  # =========================================================
  build-and-push:
    runs-on: ubuntu-latest # Runs on a clean cloud computer provided by GitHub
    outputs:
      # Saves the version tag generated in this job so Job 2 (deployment) can read it later
      version_tag: ${{ steps.set_version.outputs.VERSION_TAG }}
    
    steps:
      # Step 1: Clone your repository files onto GitHub's cloud runner environment
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Generate a unique version tag based on how many times this pipeline has run
      - name: Set Unique Version Tag
        id: set_version
        run: |
          TAG="v1.${{ github.run_number }}"
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_TAG=$TAG" >> $GITHUB_OUTPUT

      # Step 3: Authenticate with Docker Hub using your exact secret names
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build backend using your actual './server' directory
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            adnanshakeel231/backend:${{ env.VERSION_TAG }}
            adnanshakeel231/backend:latest

      # Step 5: Build frontend using your actual './client' directory
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            adnanshakeel231/frontend:${{ env.VERSION_TAG }}
            adnanshakeel231/frontend:latest

  # =========================================================
  # JOB 2: Connect to your server and run the new container versions
  # =========================================================
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into EC2 and Run Dynamic Version Stack
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            if [ ! -d "dev_ops_project" ]; then
              git clone https://github.com/Aadii231/dev_ops_project.git
            fi
            cd ~/dev_ops_project
            
            # Fetch latest repository tracking lines
            git fetch origin main
            git reset --hard origin/main
            
            # 👑 THE ABSOLUTE FIX: Write the version tag into a local file on the server.
            # This completely bypasses 'sudo' dropping session environment variables!
            echo "VERSION_TAG=${{ needs.build-and-push.outputs.version_tag }}" > .env
            
            # Stop the old running stack safely
            sudo /usr/local/bin/docker-compose down
            
            # Pull down the fresh images explicitly using the newly saved environment settings
            sudo /usr/local/bin/docker-compose pull
            
            # Run the new containers in background detached mode
            sudo /usr/local/bin/docker-compose up -d
            
            # Show the active container list in your logs
            sudo /usr/local/bin/docker-compose ps