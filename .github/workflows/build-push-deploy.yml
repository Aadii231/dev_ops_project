name: Task 2 - Build, Push, and Version Deploy

on:
  push:
    branches:
      - main

jobs:
  # =========================================================
  # JOB 1: Compile code, build Docker images, and push to cloud
  # =========================================================
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.set_version.outputs.VERSION_TAG }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Unique Version Tag
        id: set_version
        run: |
          TAG="v1.${{ github.run_number }}"
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            adnanshakeel231/backend:${{ env.VERSION_TAG }}
            adnanshakeel231/backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            adnanshakeel231/frontend:${{ env.VERSION_TAG }}
            adnanshakeel231/frontend:latest

  # =========================================================
  # JOB 2: Connect to your server and run the new container versions
  # =========================================================
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into EC2 and Run Dynamic Version Stack
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            if [ ! -d "dev_ops_project" ]; then
              git clone https://github.com/Aadii231/dev_ops_project.git
            fi
            cd ~/dev_ops_project
            
            # Wipe out local configs to match your latest GitHub push
            git fetch origin main
            git reset --hard origin/main
            
            # Export the version tag for this specific run
            export VERSION_TAG=${{ needs.build-and-push.outputs.version_tag }}
            
            # 🚨 1. Stop and remove the old running containers completely
            sudo /usr/local/bin/docker-compose down
            
            # 👑 2. THE CRITICAL FIX: Force the server to pull the brand new images from Docker Hub
            sudo VERSION_TAG=$VERSION_TAG /usr/local/bin/docker-compose pull
            
            # 3. Boot up the freshly pulled versions in detached mode
            sudo VERSION_TAG=$VERSION_TAG /usr/local/bin/docker-compose up -d
            
            # 4. Print container status to confirm success
            sudo /usr/local/bin/docker-compose ps