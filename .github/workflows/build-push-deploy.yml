name: Task 2 - Build, Push, and Version Deploy

on:
  push:
    branches:
      - main

jobs:
  # =========================================================
  # JOB 1: Compile code, build Docker images, and push to cloud
  # =========================================================
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.set_version.outputs.VERSION_TAG }}
    
    steps:
      # Step 1: Clone your repository files onto the GitHub cloud computer
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Generate a unique version tag based on run count
      - name: Set Unique Version Tag
        id: set_version
        run: |
          TAG="v1.${{ github.run_number }}"
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_TAG=$TAG" >> $GITHUB_OUTPUT

      # Step 3: Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Now that files exist, build and push the Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            adnanshakeel231/backend:${{ env.VERSION_TAG }}
            adnanshakeel231/backend:latest

      # Step 5: Build and push the Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            adnanshakeel231/frontend:${{ env.VERSION_TAG }}
            adnanshakeel231/frontend:latest

  # =========================================================
  # JOB 2: Connect to your server and run the new container versions
  # =========================================================
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into EC2 and Run Dynamic Version Stack
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            if [ ! -d "dev_ops_project" ]; then
              git clone https://github.com/Aadii231/dev_ops_project.git
            fi
            cd ~/dev_ops_project
            
            git fetch origin main
            git reset --hard origin/main
            
            export VERSION_TAG=${{ needs.build-and-push.outputs.version_tag }}
            
            sudo /usr/local/bin/docker-compose down
            sudo VERSION_TAG=$VERSION_TAG /usr/local/bin/docker-compose up -d
            sudo /usr/local/bin/docker-compose ps