name: Remote Deploy and Log Pipeline

on:
  push:
    branches:
      - main  # Triggers the pipeline when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 # Change if your server uses a non-standard SSH port
          script: |
            # 1. Navigate to your project directory
            cd /path/to/your/project/directory
            
            # 2. Pull the latest code from GitHub
            echo "Pulling latest changes from GitHub..."
            git pull origin main
            
            # 3. Build and launch the containers
            echo "Running Docker Compose..."
            # Note: Depending on your server's Docker setup, you might need 'docker-compose' instead of 'docker compose'
            docker compose down
            docker compose up -d --build
            
            # 4. Show the running container logs
            echo "Fetching latest container logs..."
            docker compose logs --tail=50