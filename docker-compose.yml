services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports: 
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network
  backend:
    build: ./server
    container_name: backend
    env_file:
      - ./server/.env
    ports:
      - 5001:5001
    depends_on:
      - mongodb
    networks:
      - mern-network
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    container_name: frontend
    depends_on:
      - backend
    networks:
      - mern-network
volumes:
  mongo-data:
networks:
  mern-network:
    driver: bridge
